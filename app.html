<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2444"><title>Fall 2026 Strategic Planner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}:root{--navy:#0b2444;--blue:#287cf0;--green:#1aa66a;--red:#df4c4c;--bg:#f5f8fc;--line:#e1e8f1;--text:#15294a}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.gate{position:fixed;inset:0;z-index:20;background:linear-gradient(145deg,#071a33,#0b2444 55%,#123b70);display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);background:#fff;padding:28px;border-radius:22px;box-shadow:0 25px 70px #0006}.login input{width:100%;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:11px}.primary{border:0;background:var(--blue);color:#fff;padding:12px 16px;border-radius:10px;font-weight:700}.err{color:#b42318;margin-top:10px}.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(160deg,#102f59,#0b2444 50%,#081b34);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:850;padding:8px 12px 24px}.brand span{color:#77b4ff}.nav button{display:block;width:100%;border:0;background:none;color:#dbe9f8;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0;cursor:pointer}.nav button.active{background:#2b7ee044;color:#fff}.main{padding:28px;min-width:0;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.sync{padding:6px 10px;border-radius:99px;background:#e5f7ee;color:#087a49;font-size:12px}.signout{border:1px solid #cbd5e1;background:#fff;padding:7px 10px;border-radius:8px}.view{display:none}.view.active{display:block}h1{font-size:34px;margin:0 0 4px}h2{margin:0 0 8px}.muted{color:#718096}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 4px 15px #17375d0a;min-width:0}.metric b{display:block;font-size:28px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}.task{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f6;align-items:start}.task input[type=checkbox]{width:19px;height:19px}.taskline{font-weight:600}.controls{display:grid;grid-template-columns:110px minmax(140px,200px) minmax(160px,1fr);gap:8px;margin-top:7px}.controls>*{min-width:0;padding:7px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.tag{font-size:11px;border-radius:99px;padding:5px 8px;background:#eaf4ff;color:#0969d8;white-space:nowrap}.tag.Personal{background:#e8f8ef;color:#11824f}.tag.Teaching{background:#ffeded;color:#c92c2c}.goal{border-left:4px solid var(--blue);margin:12px 0}.goal.Personal{border-color:var(--green)}.goal.Teaching{border-color:var(--red)}.editable{width:100%;border:1px solid transparent;background:transparent;padding:7px;border-radius:7px}.editable:focus{outline:0;border-color:#bcd5f2;background:#fff}.bar{height:12px;background:#e7edf5;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue)}.week{margin:12px 0}.weekhead{display:flex;justify-content:space-between;gap:10px}.planstep{padding:10px 0;border-top:1px solid #edf1f6}.due{float:right;color:#718096;font-size:12px}.alltask{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f6}.notes{width:100%;min-height:420px;padding:14px;border:1px solid var(--line);border-radius:10px;resize:vertical}.bottom{display:none}@media(max-width:900px){.app{display:block}.side{display:none}.main{padding:18px 14px 92px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));background:#0b2444f2;padding:6px;border-radius:18px;z-index:10}.bottom button{border:0;background:none;color:#c7dcf4;padding:10px 2px;font-size:11px}.bottom button.active{background:#2b7ee044;color:#fff;border-radius:12px}}@media(max-width:620px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.task{grid-template-columns:25px minmax(0,1fr)}.task>.tag{grid-column:2}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.alltask{grid-template-columns:55px 1fr}.alltask .tag{display:none}}</style></head><body><div class="gate" id="gate"><form class="login" id="login"><h2>Fall 2026 Planner</h2><p class="muted">Sign in to sync across Windows and iPad.</p><input id="email" type="email" placeholder="Email" required><input id="pass" type="password" placeholder="Password" required><button class="primary">Sign in</button><div class="err" id="err"></div></form></div><div class="app"><aside class="side"><div class="brand">Fall 2026<br><span>Strategic Planner</span></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><b>Welcome, Sasan</b><div class="muted" id="weekLabel"></div></div><div><span class="sync" id="sync">Signed out</span> <button class="signout" id="logout">Sign out</button></div></header><section class="view active" id="Dashboard"></section><section class="view" id="Goals"></section><section class="view" id="CoursePlan"></section><section class="view" id="PersonalPlan"></section><section class="view" id="TeachingPlan"></section><section class="view" id="Weekly"></section><section class="view" id="Calendar"></section><section class="view" id="Tasks"></section><section class="view" id="Notes"></section><section class="view" id="Progress"></section><section class="view" id="Insights"></section><section class="view" id="Settings"></section></main></div><nav class="bottom" id="bottom"></nav><script>const SB=supabase.createClient('https://dfmvdtmicywoaimugfld.supabase.co','sb_publishable_ff6foZma6clQd0boAGWfvw_ZcYz6qs0',{auth:{persistSession:true,autoRefreshToken:true}});let user=null,state=null,cloudTime='',timer=null;const fallback={goals:[],steps:[],weeks:[],notes:''};const labels={Dashboard:'Dashboard',Goals:'Semester Goals',CoursePlan:'Course Plan',PersonalPlan:'Personal Plan',TeachingPlan:'Teaching Plan',Weekly:'Weekly Planner',Calendar:'Calendar',Tasks:'Tasks',Notes:'Notes',Progress:'Progress',Insights:'Delay Insights',Settings:'Settings'};const order=Object.keys(labels);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function currentWeek(){let d=new Date(),s=new Date(2026,7,23);return Math.max(1,Math.min(16,Math.floor((d-s)/604800000)+1))}function tasks(){return(state?.weeks||[]).flatMap(w=>(w.tasks||[]).map(t=>({...t,week:w.id})))}function stat(){let a=tasks(),done=a.filter(t=>t.done).length,miss=a.filter(t=>t.status==='Missed').length;return{a,done,miss,p:a.length?Math.round(done/a.length*100):0}}function setupNav(){nav.innerHTML=order.map((v,i)=>`<button data-v="${v}" class="${i?'':'active'}">${labels[v]}</button>`).join('');bottom.innerHTML=['Dashboard','Weekly','Tasks','Progress','Insights'].map((v,i)=>`<button data-v="${v}" class="${i?'':'active'}">${labels[v]}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v))}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render(v)}function plan(cat){let gs=(state.goals||[]).filter(g=>g.cat===cat);return`<h1>${cat} Plan</h1><div class="muted">Goals and action steps for this semester</div>`+gs.map(g=>{let gi=state.goals.indexOf(g),ss=(state.steps||[]).filter(s=>s.goal===gi);return`<div class="card goal ${cat}"><b>${esc(g.text)}</b>${ss.map(s=>`<div class="planstep">${esc(s.text)}<span class="due">${esc(s.due)}</span></div>`).join('')}</div>`}).join('')}function taskHTML(w){return(w.tasks||[]).map(t=>`<div class="task"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><div><input class="editable taskline" data-text="${t.id}" value="${esc(t.text)}"><div class="controls"><select data-status="${t.id}"><option ${t.status!=='Missed'?'selected':''}>On track</option><option ${t.status==='Missed'?'selected':''}>Missed</option></select><select data-reason="${t.id}"><option value="">Reason…</option>${['Workload','Underestimated time','Unexpected issue','Waiting / dependency','Low priority','Schedule conflict','Personal reason','Other'].map(r=>`<option ${t.reason===r?'selected':''}>${r}</option>`).join('')}</select><input data-note="${t.id}" placeholder="Note" value="${esc(t.note||'')}"></div></div><span class="tag ${t.cat}">${t.cat}</span></div>`).join('')}function render(v=document.querySelector('.view.active')?.id||'Dashboard'){if(!state)return;let cw=currentWeek(),w=state.weeks?.[cw-1]||{range:'',tasks:[],reward:''},S=stat();weekLabel.textContent=`Week ${cw} • ${w.range||''}`;if(v==='Dashboard')Dashboard.innerHTML=`<h1>Dashboard</h1><div class="muted">A quick overview of your semester</div><div class="cards"><div class="card metric"><b>${S.p}%</b>Overall progress</div><div class="card metric"><b>${S.done}</b>Completed</div><div class="card metric"><b>${S.miss}</b>Missed</div><div class="card metric"><b>Week ${cw}</b>${esc(w.range)}</div></div><div class="grid"><div class="card"><h2>Current Week</h2>${taskHTML(w)}</div><div class="card"><h2>Progress</h2><p>${S.done} of ${S.a.length} weekly tasks completed</p><div class="bar"><div class="fill" style="width:${S.p}%"></div></div><h2 style="margin-top:26px">Reward</h2><p>${esc(w.reward)}</p></div></div>`;if(v==='Goals')Goals.innerHTML=`<h1>Semester Goals</h1><div class="muted">Single source of truth for your semester goals</div>`+(state.goals||[]).map(g=>`<div class="card goal ${g.cat}"><b>${g.cat}</b><input class="editable" data-goal="${g.id}" value="${esc(g.text)}"></div>`).join('');if(v==='CoursePlan')CoursePlan.innerHTML=plan('Course');if(v==='PersonalPlan')PersonalPlan.innerHTML=plan('Personal');if(v==='TeachingPlan')TeachingPlan.innerHTML=plan('Teaching');if(v==='Weekly')Weekly.innerHTML=`<h1>Weekly Planner</h1><div class="muted">All 16 semester weeks</div>`+(state.weeks||[]).map(w=>`<div class="card week"><div class="weekhead"><h2>Week ${w.id}</h2><span class="muted">${esc(w.range)}</span></div>${taskHTML(w)}<p><b>Reward:</b> ${esc(w.reward)}</p></div>`).join('');if(v==='Calendar')Calendar.innerHTML=`<h1>Calendar</h1><div class="cards">`+(state.weeks||[]).map(w=>`<div class="card"><b>Week ${w.id}</b><div class="muted">${esc(w.range)}</div><p>${(w.tasks||[]).length} tasks</p><small>Reward: ${esc(w.reward)}</small></div>`).join('')+'</div>';if(v==='Tasks')Tasks.innerHTML=`<h1>Tasks</h1><div class="muted">All semester tasks</div><div class="card">`+S.a.map(t=>`<div class="alltask"><small>Week ${t.week}</small><span>${esc(t.text)}</span><span class="tag ${t.cat}">${t.cat}</span></div>`).join('')+'</div>';if(v==='Notes')Notes.innerHTML=`<h1>Notes</h1><div class="card"><textarea class="notes" id="notesBox">${esc(state.notes||'')}</textarea></div>`;if(v==='Progress')Progress.innerHTML=`<h1>Progress</h1><div class="cards"><div class="card metric"><b>${S.p}%</b>Overall</div><div class="card metric"><b>${S.done}</b>Completed</div><div class="card metric"><b>${S.miss}</b>Missed</div><div class="card metric"><b>${S.a.length-S.done}</b>Open</div></div><div class="card"><div class="bar"><div class="fill" style="width:${S.p}%"></div></div></div>`;if(v==='Insights'){let bad=S.a.filter(t=>t.status==='Missed'||t.reason||t.note);Insights.innerHTML=`<h1>Delay Insights</h1><div class="card">${bad.length?bad.map(t=>`<p><b>Week ${t.week}: ${esc(t.text)}</b><br><span style="color:#b42318">${esc(t.status)}</span> • ${esc(t.reason||'No reason')}<br><span class="muted">${esc(t.note||'')}</span></p>`).join(''):'No delay records yet.'}</div>`}if(v==='Settings')Settings.innerHTML=`<h1>Settings</h1><div class="card"><h2>Cloud Sync</h2><p>Supabase sync is active for this account.</p><p class="muted">Changes are cached locally and synchronized across your devices.</p></div>`;bind()}function findTask(id){for(const w of state.weeks||[]){let t=(w.tasks||[]).find(x=>x.id===id);if(t)return t}}function bind(){document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{findTask(x.dataset.check).done=x.checked;save();render()});document.querySelectorAll('[data-text]').forEach(x=>x.onchange=()=>{findTask(x.dataset.text).text=x.value;save()});document.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>{findTask(x.dataset.status).status=x.value;save();render()});document.querySelectorAll('[data-reason]').forEach(x=>x.onchange=()=>{findTask(x.dataset.reason).reason=x.value;save()});document.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>{findTask(x.dataset.note).note=x.value;save()});document.querySelectorAll('[data-goal]').forEach(x=>x.onchange=()=>{let g=state.goals.find(g=>g.id===x.dataset.goal);if(g)g.text=x.value;save()});let n=document.getElementById('notesBox');if(n)n.oninput=()=>{state.notes=n.value;save()}}function cache(){localStorage.setItem('fall26-full-state',JSON.stringify(state))}function save(){cache();sync.textContent=navigator.onLine?'Saving…':'Offline';clearTimeout(timer);timer=setTimeout(push,650)}async function push(){if(!user||!navigator.onLine)return;let payload={user_id:user.id,data:state,updated_at:new Date().toISOString()},q=await SB.from('planner_state').select('id').eq('user_id',user.id).maybeSingle(),r=q.data?await SB.from('planner_state').update(payload).eq('id',q.data.id):await SB.from('planner_state').insert(payload);sync.textContent=r.error?'Sync error':'Synced';if(!r.error)cloudTime=payload.updated_at}async function pull(){if(!user)return;sync.textContent='Loading…';let r=await SB.from('planner_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.data?.data){state=r.data.data;cloudTime=r.data.updated_at;cache()}else{let c=localStorage.getItem('fall26-full-state');state=c?JSON.parse(c):fallback;await push()}sync.textContent=r.error?'Sync error':'Synced';render()}login.onsubmit=async e=>{e.preventDefault();err.textContent='';let r=await SB.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)return err.textContent=r.error.message;user=r.data.user;gate.style.display='none';await pull()};logout.onclick=async()=>{await SB.auth.signOut();location.reload()};SB.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;gate.style.display='none';await pull()}});window.addEventListener('online',()=>pull());window.addEventListener('offline',()=>sync.textContent='Offline');setInterval(async()=>{if(!user||!navigator.onLine)return;let r=await SB.from('planner_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.data?.updated_at&&r.data.updated_at>cloudTime){state=r.data.data;cloudTime=r.data.updated_at;cache();render();sync.textContent='Synced'}},15000);setupNav();</script></body></html>
