<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2444"><title>Fall 2026 Strategic Planner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#0b2444;--b:#1677f2;--g:#17ad67;--r:#e64b4b;--bg:#f5f8fc;--line:#e2e9f2}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI;background:var(--bg);color:#13294b}.gate{position:fixed;inset:0;z-index:9;background:linear-gradient(145deg,#071a33,#0b2444 55%,#123b70);display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);background:white;padding:28px;border-radius:22px;box-shadow:0 25px 70px #0006}.login h1{margin:0 0 6px}.login p{color:#68768c}.login input{width:100%;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:11px;font-size:16px}.login button,.primary{border:0;background:var(--b);color:white;padding:12px 16px;border-radius:10px;font-weight:700}.err{color:#b42318;margin-top:10px}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(160deg,#102f59,#0b2444 45%,#081b34);color:white;padding:24px 15px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:800;padding:10px 12px 25px}.brand span{color:#70b3ff}.nav button{width:100%;border:0;background:none;color:#d9e8f9;text-align:left;padding:12px;border-radius:10px;margin:2px 0}.nav button.active{background:#287cf044}.main{padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.sync{padding:6px 10px;border-radius:99px;background:#e6f7ef;color:#087a49;font-size:12px}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 15px #17375d0a}.metric b{font-size:28px;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}h2{font-size:30px;margin:0 0 4px}.muted{color:#718096}.task{display:grid;grid-template-columns:25px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid #edf1f6}.task input{width:19px;height:19px}.tag{font-size:11px;border-radius:99px;padding:4px 8px;background:#eaf4ff;color:#0969d8}.tag.Personal{background:#e8f8ef;color:#11824f}.tag.Teaching{background:#ffeded;color:#c92c2c}.goal{border-left:4px solid var(--b);margin:9px 0}.goal.Personal{border-color:var(--g)}.goal.Teaching{border-color:var(--r)}.goal input,.step input,.task input[type=text],textarea{border:1px solid transparent;background:transparent;width:100%;padding:7px;border-radius:7px}.goal input:focus,.step input:focus,.task input[type=text]:focus,textarea:focus{background:#fff;border-color:#bcd5f2;outline:0}.week{margin:10px 0}.week h3{margin:0 0 8px}.bar{height:12px;background:#e7edf5;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--b)}.reason{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}.reason select,.reason input{padding:6px;border:1px solid var(--line);border-radius:7px}.danger{color:#b42318}.bottom{display:none}@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:18px 14px 90px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:9px;right:9px;background:#0b2444ee;border-radius:18px;padding:6px;z-index:5}.bottom button{border:0;background:none;color:#c7dcf4;padding:10px 2px;font-size:11px}.bottom button.active{background:#2b7ee044;color:white;border-radius:12px}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.metric b{font-size:23px}}</style></head><body><div class="gate" id="gate"><form class="login" id="login"><h1>Fall 2026 Planner</h1><p>Sign in to sync your planner across Windows and iPad.</p><input id="email" type="email" placeholder="Email" autocomplete="username" required><input id="pass" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button><div class="err" id="err"></div></form></div><div class="app"><aside class="side"><div class="brand">Fall 2026<br><span>Strategic Planner</span></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><b>Welcome, Sasan</b><div class="muted" id="weekLabel"></div></div><div><span class="sync" id="sync">Signed out</span> <button onclick="logout()">Sign out</button></div></div><section class="view active" id="Dashboard"></section><section class="view" id="Weekly"></section><section class="view" id="Goals"></section><section class="view" id="Steps"></section><section class="view" id="Progress"></section><section class="view" id="Insights"></section><section class="view" id="Notes"></section></main></div><nav class="bottom" id="bottom"></nav><script>
const SB=supabase.createClient('https://dfmvdtmicywoaimugfld.supabase.co','sb_publishable_ff6foZma6clQd0boAGWfvw_ZcYz6qs0',{auth:{persistSession:true,autoRefreshToken:true}});
const goals=[['Course','Complete all Fall 2026 courses with a grade of at least A'],['Course','Complete my Advanced Quality Control and MILP final projects by November 20'],['Course','Learn Gorubi package'],['Personal','Improve my English communication skills'],['Personal','Exercise at least three times per week'],['Personal','Improve my time-management and deep work skills'],['Teaching','Increase student participation in the recitation sessions'],['Teaching','Improve my teaching approach and find a method that works best for both my students and me, by using the materials, assignments, and projects from the Mentored Teaching in Engineering course'],['Teaching','Improve my ability to present engineering and mathematical concepts']];

ly'],['Personal',5,'Review delays/idles/missed deadlines/reasons/write about them Sundays','Sunday'],['Teaching',6,'Plan week’s recitation to achieve more engagement','Weekly'],['Teaching',6,'Get student feedback','Monthly'],['Teaching',6,'Take notes on perceived class quality','Weekly'],['Teaching',6,'Record classes','Weekly'],['Teaching',6,'Review recordings/feedback/notes and adjust plan','Monthly'],['Teaching',7,'Review Mentored Teaching class material','Weekly'],['Teaching',7,'Adjust teaching plan with concepts learned','Weekly'],['Teaching',7,'Collect structured student feedback second and last week of semester','Week 2 / Week 15'],['Teaching',7,'Discuss ideas with instructor','Monthly'],['Teaching',7,'Share results/experiences through EGR6283 assignments','By deadlines'],['Teaching',7,'Create clear picture of teaching structure/plan/philosophy','Dec. 3'],['Teaching',8,'Review topics/textbook before recitation','Weekly'],['Teaching',8,'Prepare concise step-by-step recitation plan','Weekly'],['Teaching',8,'Record/review classes','Weekly'],['Teaching',8,'Use instructor/student/self-evaluation feedback','Monthly']];
const weekly=[['Aug 23–29',['Review all course syllabus/material','Review AQC/MILP intro/material','Set up folders/simple project plan','Start English practice podcast/TV/reading/shadowing','3 exercise sessions','Plan week + 2 deep-work days','Prepare week’s DE recitation','Review first-order IVPs/separable ODEs','Plan questions/practice problems'],'Movie'],['Aug 30–Sep 5',['AQC/MILP content review','Work on AQC HW1 before deadline','Possible project ideas','English 5 days','Exercise 3 times','Review waste time/short gaps Sunday','First-order linear/exact ODE recitation','EGR6283 assignments/reflection/review materials','Record class and write notes'],'Favorite meal'],['Sep 6–12',['Submit AQC HW1','Content review','Start Gurobi/simple model','Write project ideas','Keep English practice','Exercise 3 times','2 deep-work days/review','Linear modeling/growth + decay/Exam 1 review','More student questions','EGR6283 work; record classes/notes'],'One day relaxing'],['Sep 13–19',['Submit AQC HW2','Content review','Discuss project ideas','Finish Gurobi setup/basic models','English 5 days','Exercise 3 times','Sunday plan/protect deep work','Second-order linear ODE theory/reduction','Use Mentored Teaching idea','Record/notes'],'Big mac+Large size cook'],['Sep 20–26',['Submit HW3','Content review','Finalize AQC/MILP project question/data/method by Sep 25','Gurobi tutorials','English routines','Exercise 3 times','Review low-efficiency','Homogeneous/nonhomogeneous constant-coefficient ODEs','Compare engagement','EGR6283 + record notes'],'A book'],['Sep 27–Oct 3',['Prepare AQC Exam I','Content review','Complete intro Gurobi tutorials','Project work','English practice','Exercise 3 times','Focused study/review delays Sunday','Second-order modeling/Exam 2 review','Clarity review','EGR6283 + record notes'],'Send an email to myself'],['Oct 4–10',['Literature/background both projects','Content review','LP + MILP Gurobi','Organize references','English 5 days','Exercise 3 times','2 deep-work days','Laplace/inverse/ODE solving','Ask students explain solutions','Review participation + EGR6283'],'Social time'],['Oct 11–17',['Catch up','Organize literature/background','Computational model','Gurobi examples','Lighter English','Exercise 3 times','Reset schedule','S-axis translation','Test two teaching approaches','Review recordings/notes + EGR6283'],'Small gear or gadget'],['Oct 18–24',['Submit HW4','Build/test main AQC/MILP models','Content review','Gurobi project models','English 5 days','Exercise 3 times','Review personal progress','Unit step/T-axis/convolution/Exam 3 review','Compare student responses','Short feedback + EGR6283'],'San Antonio riverside walking'],['Oct 25–31',['Submit HW5','Major project coding/model development','Content review','Gurobi solution status/MIP gap/diagnostics','English practice','Exercise 3 times','Deep work projects','Systems via diagonalization','Rehearse explanations','Review recordings/presentation issues + EGR6283'],'Random amazon shopping'],['Nov 1–7',['Submit HW6','Project experiments','Results/figures/tables','Content review','English 5 days','Exercise 3 times','Prioritize project','Eigenvalue BVPs/separable PDEs','Review teaching approach','Discuss instructor + EGR6283'],'Movie night'],['Nov 8–14',['AQC Project Proposal','Analyze results','Draft figures/tables/discussion','Content review','English practice','Exercise 3 times','Focused schedule','Classical PDEs/BVPs/heat/Exam 4','Student space','Feedback/adjust + EGR6283'],'Something based on my mode!'],['Nov 15–21',['Submit HW7','Finish analysis/writing AQC/MILP','Revise figures/tables/results','Complete/polish both by Nov 20','Content review','English practice','Exercise 3 times','Deep work','Wave equation','Finalize teaching practices; collect feedback + EGR6283'],'Free evening'],['Nov 22–28',['Revise reports','AQC final presentation prep','Content review','Remaining coursework','Lighter English','Exercise 3 times','Rest','Laplace equation','Klesse Tech Symposium','Review feedback/recordings/notes'],'Relaxing weekend'],['Nov 29–Dec 5',['AQC presentation','Prepare Exam II','Remaining MILP/course deliverables','Final exam review','English practice','Exercise 3 times','Deep work finalize projects','Final DE review','Difficult topics/common mistakes','Teaching summary + EGR6283'],'Movie'],['Dec 6–12',['Final exams/submissions','Verify requirements','Final grades/progress','Organize project files','Rest/review semester','Support DE final review','End-semester reflection','Summarize feedback/observations','Short next-semester improvement plan'],'Dinner out']];
let state={goals:goals.map((x,i)=>({id:'g'+i,cat:x[0],text:x[1]})),steps:stepText.map((x,i)=>({id:'s'+i,cat:x[0],goal:x[1],text:x[2],due:x[3]})),weeks:weekly.map((w,i)=>({id:i+1,range:w[0],reward:w[2],tasks:w[1].map((t,j)=>({id:`w${i+1}t${j}`,text:t,cat:j<Math.ceil(w[1].length/3)?'Course':j<Math.ceil(w[1].length*2/3)?'Personal':'Teaching',done:false,status:'On track',reason:'',note:''}))})),notes:''};let user=null,timer=null,cloudTime='';
const views=['Dashboard','Weekly','Goals','Steps','Progress','Insights','Notes'];function nav(){navEl.innerHTML=views.map(v=>`<button data-v="${v}" class="${v==='Dashboard'?'active':''}">${v}</button>`).join('');bottom.innerHTML=['Dashboard','Weekly','Goals','Progress','Insights'].map(v=>`<button data-v="${v}" class="${v==='Dashboard'?'active':''}">${v}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v))}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render()}
function currentWeek(){let d=new Date(),start=new Date(2026,7,23);return Math.max(1,Math.min(16,Math.floor((d-start)/604800000)+1))}function allTasks(){return state.weeks.flatMap(w=>w.tasks.map(t=>({...t,week:w.id})))}function stats(){let a=allTasks(),done=a.filter(x=>x.done).length,miss=a.filter(x=>x.status==='Missed').length;return{a,done,miss,p:a.length?Math.round(done/a.length*100):0}}
function render(){let cw=currentWeek(),S=stats(),w=state.weeks[cw-1];weekLabel.textContent=`Week ${cw} • ${w.range}`;Dashboard.innerHTML=`<h2>Dashboard</h2><div class="muted">A quick overview of your semester</div><div class="cards" style="margin-top:18px"><div class="card metric"><b>${S.p}%</b>Overall progress</div><div class="card metric"><b>${S.done}</b>Completed</div><div class="card metric"><b>${S.miss}</b>Missed</div><div class="card metric"><b>Week ${cw}</b>${w.range}</div></div><div class="grid"><div class="card"><h3>Current Week</h3>${tasksHTML(w)}</div><div class="card"><h3>Progress</h3><p>${S.done} of ${S.a.length} weekly tasks completed</p><div class="bar"><div class="fill" style="width:${S.p}%"></div></div><h3 style="margin-top:24px">Reward</h3><p>${w.reward}</p></div></div>`;Weekly.innerHTML=`<h2>Weekly Planner</h2>${state.weeks.map(w=>`<div class="card week"><h3>Week ${w.id} <span class="muted">${w.range}</span></h3>${tasksHTML(w)}<p><b>Reward:</b> ${w.reward}</p></div>`).join('')}`;Goals.innerHTML=`<h2>Semester Goals</h2>${state.goals.map(g=>`<div class="card goal ${g.cat}"><b>${g.cat}</b><input value="${esc(g.text)}" onchange="editGoal('${g.id}',this.value)"></div>`).join('')}`;Steps.innerHTML=`<h2>Map the Steps</h2>${state.steps.map(s=>`<div class="card step"><span class="tag ${s.cat}">${s.cat}</span><input value="${esc(s.text)}" onchange="editStep('${s.id}',this.value)"><small class="muted">${s.due}</small></div>`).join('')}`;Progress.innerHTML=`<h2>Progress</h2><div class="card"><h3>${S.p}% complete</h3><div class="bar"><div class="fill" style="width:${S.p}%"></div></div><p>${S.done} completed • ${S.miss} missed • ${S.a.length-S.done} open</p></div>`;let bad=S.a.filter(t=>t.status==='Missed'||t.reason||t.note);Insights.innerHTML=`<h2>Delay Insights</h2><div class="cards"><div class="card metric"><b>${S.miss}</b>Missed</div><div class="card metric"><b>${bad.filter(x=>x.reason).length}</b>With reason</div></div><div class="card" style="margin-top:15px">${bad.length?bad.map(t=>`<p><b>Week ${t.week}: ${esc(t.text)}</b><br><span class="danger">${t.status}</span> • ${esc(t.reason||'No reason')}<br><span class="muted">${esc(t.note||'')}</span></p>`).join(''):'No delay records yet.'}</div>`;Notes.innerHTML=`<h2>Notes</h2><div class="card"><textarea rows="18" oninput="state.notes=this.value;save()">${esc(state.notes||'')}</textarea></div>`;bindTasks()}
function tasksHTML(w){return w.tasks.map(t=>`<div class="task"><input type="checkbox" data-id="${t.id}" ${t.done?'checked':''}><div><input type="text" data-text="${t.id}" value="${esc(t.text)}"><div class="reason"><select data-status="${t.id}"><option ${t.status==='On track'?'selected':''}>On track</option><option ${t.status==='Missed'?'selected':''}>Missed</option></select><select data-reason="${t.id}"><option value="">Reason…</option>${['Workload','Underestimated time','Unexpected issue','Waiting / dependency','Low priority','Schedule conflict','Personal reason','Other'].map(r=>`<option ${t.reason===r?'selected':''}>${r}</option>`).join('')}</select><input data-note="${t.id}" placeholder="Note" value="${esc(t.note||'')}"></div></div><span class="tag ${t.cat}">${t.cat}</span></div>`).join('')}
function findTask(id){for(const w of state.weeks){let t=w.tasks.find(x=>x.id===id);if(t)return t}}function bindTasks(){document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{findTask(x.dataset.id).done=x.checked;save();render()});document.querySelectorAll('[data-text]').forEach(x=>x.onchange=()=>{findTask(x.dataset.text).text=x.value;save()});document.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>{findTask(x.dataset.status).status=x.value;save();render()});document.querySelectorAll('[data-reason]').forEach(x=>x.onchange=()=>{findTask(x.dataset.reason).reason=x.value;save()});document.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>{findTask(x.dataset.note).note=x.value;save()})}function editGoal(id,v){state.goals.find(x=>x.id===id).text=v;save()}function editStep(id,v){state.steps.find(x=>x.id===id).text=v;save()}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function local(){localStorage.setItem('fall26-planner-cache',JSON.stringify(state))}async function save(){local();sync.textContent=navigator.onLine?'Saving…':'Offline';clearTimeout(timer);timer=setTimeout(push,600)}async function push(){if(!user||!navigator.onLine)return;let payload={user_id:user.id,data:state,updated_at:new Date().toISOString()};let q=await SB.from('planner_state').select('id').eq('user_id',user.id).maybeSingle();let r=q.data?await SB.from('planner_state').update(payload).eq('id',q.data.id):await SB.from('planner_state').insert(payload);sync.textContent=r.error?'Sync error':'Synced';if(!r.error)cloudTime=payload.updated_at}async function pull(){if(!user)return;sync.textContent='Loading…';let r=await SB.from('planner_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.data?.data){state=r.data.data;cloudTime=r.data.updated_at;local()}else{let c=localStorage.getItem('fall26-planner-cache');if(c)state=JSON.parse(c);await push()}sync.textContent=r.error?'Sync error':'Synced';render()}
login.onsubmit=async e=>{e.preventDefault();err.textContent='';let r=await SB.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)return err.textContent=r.error.message;user=r.data.user;gate.style.display='none';await pull()};async function logout(){await SB.auth.signOut();location.reload()}SB.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;gate.style.display='none';await pull()}});window.addEventListener('online',()=>{pull()});window.addEventListener('offline',()=>sync.textContent='Offline');setInterval(async()=>{if(!user||!navigator.onLine)return;let r=await SB.from('planner_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.data?.updated_at&&r.data.updated_at>cloudTime){state=r.data.data;cloudTime=r.data.updated_at;local();render();sync.textContent='Synced'}},15000);nav();render();
</script></body></html>
